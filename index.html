<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
        <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <link rel="stylesheet" href="styles/default.css">
        <link rel="stylesheet" href="styles/index.css">
        <link rel="stylesheet" href="styles/report.css">
        <title>Controle Emocional</title>
    </head>
    <body>
        <div id="ai-report">
            <div id="report-header">
                <button id="report-window-close-button"> Fechar </button>
            </div>
            <main>
                <div id="unavailable">
                    Sem dados suficientes.
                </div>
            </main>
        </div>
        <header>
            <div id="additional-content">
                <a href="versions.html">
                    Versões
                </a>
            </div>
            <div id="header-boards">
                <div id="header-start-board">
                    <button id="ai-report-dispatcher" style="margin-right: 8px;"> 
                        <ion-icon name="sparkles"></ion-icon>
                        <div>
                            Gerar Relatório 
                        </div>
                    </button>
                    <button id="report-window-open-button"> 
                        <ion-icon name="return-down-forward"></ion-icon>
                        <div>
                            Abrir relatorio
                        </div>
                    </button>
                </div>
                <div id="header-end-board">
                    <div class="button-container">
                        <button id="export"> 
                            <ion-icon name="download-outline"></ion-icon> 
                            <div>
                                Exportar dados 
                            </div>
                        </button>
                        <button id="import"> 
                            <ion-icon name="swap-horizontal-outline"></ion-icon>
                            <div>
                                Importar dados 
                            </div>
                        </button>
                    </div>
                </div>
            </div>
        </header>
        <div id="monitor">
            <div id="chart">
                <div id="chart-fallback">
                    <div id="load-animation"></div>
                </div>
            </div>
            <div id="entries">
                <div id="inputs">
                    <label>
                        Energia: <input type="number" id="energy" value="0" min="0" max="10"/>
                    </label>
                    <label>
                        Humor: <input type="number" id="humor" value="0" min="0" max="10"/>
                    </label>
                    <label>
                        Motivação: <input type="number" id="motivation" value="0" min="0" max="10"/>
                    </label>
                    <label>
                        Sono: <input type="number" id="sleep" value="0" min="0" max="10"/>
                    </label>
                    <label>
                        Irritação: <input type="number" id="stress" value="0" min="0" max="10"/>
                    </label>        
                </div>
                <div class="button-container">
                    <button id="send"> Enviar </button>
                    <button id="restart"> Limpar campos </button>
                    <button id="clear-all"> Eliminar todos os dados </button>
                </div>
                <div id="marking-status" class="daily-status">
                    Está na hora de fazer seu registro!
                </div>
                <div>
                    <h2>Avaliação</h2>
                    <div id="evaluation-data">
                        Sem dados suficientes
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="javascript/functions/utils.js"></script>
    <script src="javascript/functions/validation.js"></script>
    <script src="javascript/functions/scoreAnalysis.js"></script>

    <script src="javascript/globals.js"></script>

    <script src="javascript/dom/chart.js"></script>
    <script src="javascript/dom/status.js"></script>
    <script src="javascript/dom/report.js"></script>

    <script src="javascript/storage/memory.js"></script>
    <script src="javascript/storage/importData.js"></script>
    <script src="javascript/storage/exportData.js"></script>

    <script src="javascript/protocols.js"></script>

    <script src="javascript/events/eventHandlers.js"></script>
    <script src="javascript/events/arrive.js"></script>
</html>
